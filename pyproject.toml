
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debugmate"
version = "0.1.0"
description = "An AI-powered Python debugging assistant that helps learners understand and identify errors."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "google-genai==2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["debugmate*"]
